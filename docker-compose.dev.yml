version: '3.8'

# Development compose:
# - Runs ehr-server + mongoDB
# - Exposes API on localhost:3001 for Postman/httpie
# - Connects to OpenBao running outside this compose via host.docker.internal:8200
services:
  mongoDB:
    image: mongo:latest
    container_name: ehr-mongodb-dev
    ports:
      - "27017:27017"
    networks:
      - ehr-dev
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ehr-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ehr-server-dev
    ports:
      - "3001:3001"
    networks:
      - ehr-dev
    depends_on:
      mongoDB:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGO_URI=mongodb://mongoDB:27017/ehr-system
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://host.docker.internal:8200}
      - OPENBAO_TOKEN=${OPENBAO_TOKEN}
      - OPENBAO_TRANSIT_AES_KEY=${OPENBAO_TRANSIT_AES_KEY:-ehr-aes-master}
      - OPENBAO_TRANSIT_RSA_KEY=${OPENBAO_TRANSIT_RSA_KEY:-ehr-rsa-exchange}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    restart: unless-stopped

networks:
  ehr-dev:
    driver: bridge

volumes:
  mongo-dev-data:
    driver: local

