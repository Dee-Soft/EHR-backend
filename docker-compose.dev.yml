# Development Docker Compose Configuration
# - Runs ehr-server + mongoDB with hot reload
# - Exposes API on localhost:3001 for Postman/httpie
# - Connects to OpenBao Keys Management System via ehr-keys-management-system_ehr-keys-net network
# - Environment variables loaded from .env file
# 
# IMPORTANT: Before running, ensure the ehr-keys-management-system_ehr-keys-net network exists:
#   Option 1: Run EHR Keys Management System first
#   Option 2: Create local network: docker network create ehr-keys-management-system_ehr-keys-net
#   Option 3: Run ./scripts/check-network.sh to diagnose issues
#
# If OpenBao is not available, update .env file:
#   OPENBAO_ADDR=http://localhost:18200
#   OPENBAO_TOKEN=ehr-permanent-token
services:
  mongoDB:
    image: mongo:latest
    container_name: ehr-mongodb-dev
    ports:
      - "27017:27017"
    networks:
      - ehr-dev
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ehr-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ehr-server-dev
    ports:
      - "3001:3001"
    networks:
      - ehr-dev
      - ehr-keys-net
    depends_on:
      mongoDB:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    restart: unless-stopped

networks:
  ehr-dev:
    driver: bridge
  ehr-keys-net:
    # Connect to the existing ehr-keys-management-system_ehr-keys-net network
    # where OpenBao is running
    external: true
    name: ehr-keys-management-system_ehr-keys-net

volumes:
  mongo-dev-data:
    driver: local

