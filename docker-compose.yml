# EHR Backend Docker Compose Configuration - Production
# 
# This configuration connects to the EHR Keys Management System via the ehr-keys-net network.
# The OpenBao Keys Management System must be running separately.
#
# Environment variables are loaded from the .env file in the project root.
# Create .env file from env.example template before running.

services:
  mongoDB:
    image: mongo:latest
    container_name: ehr-mongodb
    ports:
      - "27017:27017"
    networks:
      - ehr-backend
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ehr-server:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ehr-server
    ports:
      - "3001:3001"
    networks:
      - ehr-backend
      - ehr-keys-net
    depends_on:
      mongoDB:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  ehr-backend:
    driver: bridge
  ehr-keys-net:
    external: true
    name: ehr-keys-management-system_ehr-keys-net

volumes:
  mongo-data:
    driver: local
  logs:
    driver: local