version: '3.8'

# EHR Backend Docker Compose Configuration
# 
# Note: This configuration assumes the OpenBao Keys Management System is running separately.
# The OpenBao system should be accessible at http://localhost:18200 when running locally,
# or at http://host.docker.internal:18200 when running in Docker.
#
# For production deployment, ensure proper network connectivity between this container
# and the OpenBao Keys Management System.

services:
  mongoDB:
    image: mongo:latest
    container_name: ehr-mongodb
    ports:
      - "27017:27017"
    networks:
      - ehr-backend
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ehr-server:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ehr-server
    ports:
      - "3001:3001"
    networks:
      - ehr-backend
    depends_on:
      mongoDB:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - MONGO_URI=mongodb://mongoDB:27017/ehr-system
      # OpenBao Keys Management System runs separately on port 18200
      # When running in Docker, use host.docker.internal to access localhost
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://host.docker.internal:18200}
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-ehr-permanent-token}
      - OPENBAO_TRANSIT_AES_KEY=${OPENBAO_TRANSIT_AES_KEY:-ehr-aes-master}
      - OPENBAO_TRANSIT_RSA_KEY=${OPENBAO_TRANSIT_RSA_KEY:-ehr-rsa-exchange}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  ehr-backend:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  logs:
    driver: local