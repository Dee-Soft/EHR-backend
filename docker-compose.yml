version: '3.8'

# EHR Backend Docker Compose Configuration - Production
# 
# This configuration connects to the EHR Keys Management System via the ehr-keys-net network.
# The OpenBao Keys Management System must be running separately.
#
# Environment variables are loaded from the .env file in the project root.
# Create .env file from env.example template before running.

services:
  mongoDB:
    image: mongo:latest
    container_name: ehr-mongodb
    ports:
      - "27017:27017"
    networks:
      - ehr-backend
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ehr-server:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ehr-server
    ports:
      - "3001:3001"
    networks:
      - ehr-backend
      - ehr-keys-net
    depends_on:
      mongoDB:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - MONGO_URI=${MONGO_URI:-mongodb://mongoDB:27017/ehr-system}
      # OpenBao connection via ehr-keys-net network
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://openbao:8200}
      - OPENBAO_TOKEN=${OPENBAO_TOKEN}
      - OPENBAO_TRANSIT_AES_KEY=${OPENBAO_TRANSIT_AES_KEY}
      - OPENBAO_TRANSIT_RSA_KEY=${OPENBAO_TRANSIT_RSA_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  ehr-backend:
    driver: bridge
  ehr-keys-net:
    external: true
    name: ehr-keys-net

volumes:
  mongo-data:
    driver: local
  logs:
    driver: local