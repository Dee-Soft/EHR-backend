version: '3.8'

# Docker Compose configuration for running tests
# Usage: docker-compose -f docker-compose.test.yml up --abort-on-container-exit
# Environment variables loaded from env.test file

services:
  mongodb-test:
    image: mongo:latest
    container_name: ehr-mongodb-test
    environment:
      MONGO_INITDB_DATABASE: ehr-test
    networks:
      - ehr-test
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: ehr-test-runner
    depends_on:
      mongodb-test:
        condition: service_healthy
    environment:
      - NODE_ENV=test
      - MONGO_URI=mongodb://mongodb-test:27017/ehr-test
      - JWT_SECRET=test-jwt-secret-key-for-testing-only
      - OPENBAO_ADDR=http://localhost:18200
      - OPENBAO_TOKEN=test-token
      - OPENBAO_TRANSIT_AES_KEY=test-aes-key
      - OPENBAO_TRANSIT_RSA_KEY=test-rsa-key
      - SKIP_OPENBAO_INIT=true
      - MONGO_CONNECT_TIMEOUT_MS=5000
      - MONGO_SOCKET_TIMEOUT_MS=10000
      - MONGOOSE_DEBUG=false
      - SKIP_SERVER_LISTEN=true
    networks:
      - ehr-test
    command: npm run test:coverage
    volumes:
      - ./coverage:/app/coverage

networks:
  ehr-test:
    driver: bridge

