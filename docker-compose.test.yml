
# Docker Compose configuration for running tests
# Usage: docker-compose -f docker-compose.test.yml up --abort-on-container-exit
# Environment variables loaded from env.test file

services:
  mongodb-test:
    image: mongo:latest
    container_name: ehr-mongodb-test
    networks:
      - ehr-test
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: ehr-test-runner
    depends_on:
      mongodb-test:
        condition: service_healthy
    env_file:
      - .env.test
    networks:
      - ehr-test
    command: npm run test:coverage
    volumes:
      - ./coverage:/app/coverage

networks:
  ehr-test:
    driver: bridge

